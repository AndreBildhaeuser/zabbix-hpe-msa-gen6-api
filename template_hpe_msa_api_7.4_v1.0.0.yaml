zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 7df96b18c230490a9a0a9e2307226338
    name: Templates
  templates:
  - uuid: c80fde5074c0472999c0e6090af762aa
    template: HPE MSA API
    name: HPE MSA API
    groups:
    - name: Templates
    items:
    - uuid: 5f18cdcd926b4110a8f427410e6ad558
      name: 'HPE MSA: Get disks via API'
      type: SCRIPT
      key: hpe.msa.api.disks.raw
      delay: 5m
      history: 1d
      value_type: TEXT
      params: |
        var params = JSON.parse(value);


        function fail(message) {
            throw 'HPE MSA API: ' + message;
        }


        function checkHttpStatus(request, operation) {
            var status = request.getStatus();

            if (status < 200 || status >= 300) {
                fail(operation + ' returned HTTP status ' + status);
            }
        }


        function extractProperty(xml, propertyName) {
            var pattern = new RegExp(
                '<PROPERTY[^>]+name="' + propertyName +
                '"[^>]*>([^<]*)<\\/PROPERTY>'
            );

            var match = xml.match(pattern);

            if (match === null || match.length < 2) {
                fail(
                    'Property "' + propertyName +
                    '" not found in response: ' + xml
                );
            }

            return match[1];
        }


        function decodeApiString(text) {
            return text
                .replace(/\\"/g, '"')
                .replace(/\\\\/g, '\\')
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '\r')
                .replace(/\\t/g, '\t');
        }


        function convertValue(name, rawValue) {
            var value = decodeApiString(rawValue);

            /*
             * Die API liefert für viele Werte bereits ein zusätzliches
             * Feld mit dem Suffix "-numeric". Diese Werte wandeln wir
             * in echte Zahlen um, sofern das verlustfrei möglich ist.
             */
            if (/-numeric$/.test(name)) {
                if (/^-?\d+$/.test(value)) {
                    return parseInt(value, 10);
                }

                if (/^-?\d+\.\d+$/.test(value)) {
                    return parseFloat(value);
                }
            }

            /*
             * Einige eindeutig numerische Felder besitzen kein
             * "-numeric"-Gegenstück.
             */
            if (
                name === 'slot' ||
                name === 'enclosure-id' ||
                name === 'drawer-id' ||
                name === 'port' ||
                name === 'scsi-id' ||
                name === 'blocksize' ||
                name === 'blocks' ||
                name === 'index' ||
                name === 'power-on-hours' ||
                name === 'number-of-ios' ||
                name === 'avg-rsp-time' ||
                name === 'num-depopped-heads'
            ) {
                if (/^-?\d+$/.test(value)) {
                    return parseInt(value, 10);
                }
            }

            return value;
        }


        function parseDrives(apiResponse) {
            var drives = [];

            /*
             * Jeder Laufwerksblock endet unmittelbar vor dem
             * Metadatenobjekt:
             *
             * {basetype:"drives",name:"drive",oid:"1"}
             */
            var drivePattern =
                /new APIDrives\(\[([\s\S]*?)\]\s*,?\s*\{basetype:"drives",name:"drive",oid:"([^"]+)"\}\)/g;

            var driveMatch;

            while ((driveMatch = drivePattern.exec(apiResponse)) !== null) {
                var propertyText = driveMatch[1];
                var objectId = driveMatch[2];

                var drive = {
                    "_oid": objectId
                };

                var propertyPattern =
                    /new APIProp\(\{name:"((?:\\.|[^"])*)",value:"((?:\\.|[^"])*)"\}\)/g;

                var propertyMatch;

                while (
                    (propertyMatch = propertyPattern.exec(propertyText)) !== null
                ) {
                    var name = decodeApiString(propertyMatch[1]);
                    var propertyValue = convertValue(
                        name,
                        propertyMatch[2]
                    );

                    drive[name] = propertyValue;
                }

                if (!drive['durable-id']) {
                    fail(
                        'Parsed drive block "' + objectId +
                        '" contains no durable-id.'
                    );
                }

                drives.push(drive);
            }

            if (drives.length === 0) {
                fail(
                    'No drives could be parsed from API response. ' +
                    'Response starts with: ' +
                    apiResponse.substring(0, 300)
                );
            }

            return drives;
        }


        if (!params.scheme || !params.host || !params.port) {
            fail('Scheme, host or port is missing.');
        }

        if (!params.username || !params.password) {
            fail('Username or password is missing.');
        }


        var baseUrl =
            params.scheme + '://' +
            params.host + ':' +
            params.port;


        var loginHash = sha256(
            params.username + '_' + params.password
        );


        var loginRequest = new HttpRequest();

        var loginResponse = loginRequest.get(
            baseUrl + '/api/login/' + loginHash
        );

        checkHttpStatus(loginRequest, 'Login');


        var responseType = extractProperty(
            loginResponse,
            'response-type'
        );

        if (responseType !== 'Success') {
            fail('Login failed: ' + loginResponse);
        }


        var sessionKey = extractProperty(
            loginResponse,
            'response'
        );


        var disksRequest = new HttpRequest();

        disksRequest.addHeader(
            'sessionkey: ' + sessionKey
        );

        disksRequest.addHeader(
            'datatype: wbi'
        );

        disksRequest.addHeader(
            'Cookie: wbisessionkey=' + sessionKey +
            '; wbiusername=' + params.username
        );


        var disksResponse = disksRequest.get(
            baseUrl + '/api/show/disks'
        );

        checkHttpStatus(disksRequest, 'Get disks');


        if (disksResponse.indexOf('Invalid sessionkey') !== -1) {
            fail('MSA rejected the generated session key.');
        }


        var result = {
            "drives": parseDrives(disksResponse)
        };


        return JSON.stringify(result);
      timeout: 30s
      parameters:
      - name: host
        value: '{$HPE.MSA.API.HOST}'
      - name: password
        value: '{$HPE.MSA.API.PASSWORD}'
      - name: port
        value: '{$HPE.MSA.API.PORT}'
      - name: scheme
        value: '{$HPE.MSA.API.SCHEME}'
      - name: username
        value: '{$HPE.MSA.API.USER}'
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: 7108c060d37e4cf78a62e9c3daae7b2b
        expression: nodata(/HPE MSA API/hpe.msa.api.disks.raw,{$HPE.MSA.API.NODATA})=1
        name: 'HPE MSA: Disk API data is unavailable'
        priority: AVERAGE
        description: The disk endpoint has not delivered data although the main API may still be reachable.
        dependencies:
        - name: 'HPE MSA: Management API is unavailable'
          expression: nodata(/HPE MSA API/hpe.msa.api.enclosures,{$HPE.MSA.API.NODATA})=1
        tags:
        - tag: component
          value: availability
        - tag: scope
          value: availability
    - uuid: 2250b1d1b8ea43aa994a958070bb0987
      name: 'HPE MSA: Get enclosure hardware via API'
      type: SCRIPT
      key: hpe.msa.api.enclosures
      delay: 5m
      value_type: TEXT
      params: |
        var params = JSON.parse(value);


        /*
         * Einheitlicher Fehlerpräfix, damit man in Zabbix sofort erkennt,
         * aus welchem Script eine Meldung stammt.
         */
        function fail(message) {
            throw 'HPE MSA API: ' + message;
        }


        /*
         * Prüft den HTTP-Status des zuletzt ausgeführten Requests.
         */
        function checkHttpStatus(request, operation) {
            var status = request.getStatus();

            if (status < 200 || status >= 300) {
                fail(operation + ' returned HTTP status ' + status);
            }
        }


        /*
         * Liest eine PROPERTY aus der XML-Antwort des Login-Endpunkts.
         */
        function extractXmlProperty(xml, propertyName) {
            var pattern = new RegExp(
                '<PROPERTY[^>]+name="' + propertyName +
                '"[^>]*>([^<]*)<\\/PROPERTY>'
            );

            var match = xml.match(pattern);

            if (match === null || match.length < 2) {
                fail(
                    'Property "' + propertyName +
                    '" not found in login response.'
                );
            }

            return match[1];
        }


        /*
         * Entfernt Escapes aus den HPE-API-Strings.
         */
        function decodeApiString(text) {
            return text
                .replace(/\\"/g, '"')
                .replace(/\\\\/g, '\\')
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '\r')
                .replace(/\\t/g, '\t');
        }


        /*
         * Wandelt geeignete Werte in echte Zahlen um.
         *
         * Nicht jeder String, der nur aus Ziffern besteht, darf blind
         * konvertiert werden: Firmware "0303" soll beispielsweise
         * weiterhin "0303" bleiben.
         */
        function convertValue(name, rawValue) {
            var parsedValue = decodeApiString(rawValue);

            /*
             * Felder mit "-numeric" sind von der API ausdrücklich
             * als numerische Entsprechung vorgesehen.
             */
            if (/-numeric$/.test(name)) {
                if (/^-?\d+$/.test(parsedValue)) {
                    return parseInt(parsedValue, 10);
                }

                if (/^-?\d+\.\d+$/.test(parsedValue)) {
                    return parseFloat(parsedValue);
                }
            }

            /*
             * Bekannte Mess- und Mengenfelder ohne "-numeric".
             */
            if (
                name === 'enclosure-id' ||
                name === 'dom-id' ||
                name === 'rack-number' ||
                name === 'rack-position' ||
                name === 'number-of-coolings-elements' ||
                name === 'number-of-disks' ||
                name === 'number-of-power-supplies' ||
                name === 'rows' ||
                name === 'columns' ||
                name === 'slots' ||
                name === 'enclosure-power' ||
                name === 'disks' ||
                name === 'number-of-storage-pools' ||
                name === 'virtual-disks' ||
                name === 'cache-memory-size' ||
                name === 'system-memory-size' ||
                name === 'host-ports' ||
                name === 'drive-channels' ||
                name === 'fan-out' ||
                name === 'width' ||
                name === 'sas-lanes-expected' ||
                name === 'sas-active-lanes' ||
                name === 'sas-disabled-lanes' ||
                name === 'speed'
            ) {
                if (/^-?\d+$/.test(parsedValue)) {
                    return parseInt(parsedValue, 10);
                }

                if (/^-?\d+\.\d+$/.test(parsedValue)) {
                    return parseFloat(parsedValue);
                }
            }

            return parsedValue;
        }


        /*
         * Liest alle Objekte eines bestimmten HPE-Konstruktortyps.
         *
         * Beispiel:
         *   parseApiObjects(response, 'APIFan')
         *
         * liefert alle direkt am Anfang jedes APIFan-Blocks stehenden
         * APIProp-Werte. Verschachtelte Objekte werden separat geparst
         * und nicht versehentlich dem Elternobjekt zugeschlagen.
         */
        function parseApiObjects(apiResponse, constructorName) {
            var objects = [];

            var objectPattern = new RegExp(
                'new\\s+' + constructorName +
                '\\(\\[\\s*' +
                '((?:new\\s+APIProp\\(' +
                '\\{name:"(?:\\\\.|[^"])*",' +
                'value:"(?:\\\\.|[^"])*"\\}' +
                '\\),?\\s*)+)',
                'g'
            );

            var propertyPattern =
                /new\s+APIProp\(\{name:"((?:\\.|[^"])*)",value:"((?:\\.|[^"])*)"\}\)/g;

            var objectMatch;

            while (
                (objectMatch = objectPattern.exec(apiResponse)) !== null
            ) {
                var propertyText = objectMatch[1];
                var object = {};
                var propertyMatch;

                propertyPattern.lastIndex = 0;

                while (
                    (propertyMatch = propertyPattern.exec(propertyText)) !== null
                ) {
                    var propertyName = decodeApiString(
                        propertyMatch[1]
                    );

                    object[propertyName] = convertValue(
                        propertyName,
                        propertyMatch[2]
                    );
                }

                /*
                 * Alle für uns relevanten Hardwareobjekte besitzen
                 * eine durable-id. Damit ignorieren wir unvollständige
                 * oder unerwartete Treffer.
                 */
                if (object['durable-id']) {
                    objects.push(object);
                }
            }

            return objects;
        }


        /*
         * Pflichtparameter prüfen.
         */
        if (!params.scheme || !params.host || !params.port) {
            fail('Scheme, host or port is missing.');
        }

        if (!params.username || !params.password) {
            fail('Username or password is missing.');
        }


        /*
         * Basis-URL und Login-Hash erzeugen.
         */
        var baseUrl =
            params.scheme + '://' +
            params.host + ':' +
            params.port;

        var loginHash = sha256(
            params.username + '_' + params.password
        );


        /*
         * Anmeldung an der MSA.
         */
        var loginRequest = new HttpRequest();

        var loginResponse = loginRequest.get(
            baseUrl + '/api/login/' + loginHash
        );

        checkHttpStatus(
            loginRequest,
            'Login'
        );


        var responseType = extractXmlProperty(
            loginResponse,
            'response-type'
        );

        if (responseType !== 'Success') {
            fail('Login failed: ' + loginResponse);
        }


        var sessionKey = extractXmlProperty(
            loginResponse,
            'response'
        );


        /*
         * Enclosure-Hardware abrufen.
         */
        var hardwareRequest = new HttpRequest();

        hardwareRequest.addHeader(
            'sessionkey: ' + sessionKey
        );

        hardwareRequest.addHeader(
            'datatype: wbi'
        );

        hardwareRequest.addHeader(
            'Cookie: wbisessionkey=' + sessionKey +
            '; wbiusername=' + params.username
        );


        var hardwareResponse = hardwareRequest.get(
            baseUrl + '/api/show/enclosures'
        );

        checkHttpStatus(
            hardwareRequest,
            'Get enclosure hardware'
        );


        if (
            hardwareResponse.indexOf('Invalid sessionkey') !== -1
        ) {
            fail('MSA rejected the generated session key.');
        }


        /*
         * Jeden verschachtelten Hardwaretyp in ein eigenes JSON-Array
         * zerlegen. Dadurch kann später jede Discovery Rule einfach
         * ihr passendes Array verwenden.
         */
        var result = {
            enclosures: parseApiObjects(
                hardwareResponse,
                'APIEnclosures'
            ),

            controllers: parseApiObjects(
                hardwareResponse,
                'APIControllers'
            ),

            management_ports: parseApiObjects(
                hardwareResponse,
                'APINetworkParameters'
            ),

            host_ports: parseApiObjects(
                hardwareResponse,
                'APIPort'
            ),

            sas_port_details: parseApiObjects(
                hardwareResponse,
                'APISasPort'
            ),

            expansion_ports: parseApiObjects(
                hardwareResponse,
                'APIExpanderPorts'
            ),

            expanders: parseApiObjects(
                hardwareResponse,
                'APIExpanders'
            ),

            power_supplies: parseApiObjects(
                hardwareResponse,
                'APIPowerSupplies'
            ),

            fans: parseApiObjects(
                hardwareResponse,
                'APIFan'
            )
        };


        /*
         * Plausibilitätsprüfung.
         */
        if (result.enclosures.length === 0) {
            fail(
                'No enclosures could be parsed. Response starts with: ' +
                hardwareResponse.substring(0, 300)
            );
        }

        if (result.controllers.length === 0) {
            fail('No controllers could be parsed.');
        }

        if (result.power_supplies.length === 0) {
            fail('No power supplies could be parsed.');
        }

        if (result.fans.length === 0) {
            fail('No fans could be parsed.');
        }


        return JSON.stringify(result);
      parameters:
      - name: host
        value: '{$HPE.MSA.API.HOST}'
      - name: password
        value: '{$HPE.MSA.API.PASSWORD}'
      - name: port
        value: '{$HPE.MSA.API.PORT}'
      - name: scheme
        value: '{$HPE.MSA.API.SCHEME}'
      - name: username
        value: '{$HPE.MSA.API.USER}'
      tags:
      - tag: component
        value: raw
      history: 1d
      triggers:
      - uuid: 9e3291fd71a2424283f681cc52a97276
        expression: nodata(/HPE MSA API/hpe.msa.api.enclosures,{$HPE.MSA.API.NODATA})=1
        name: 'HPE MSA: Management API is unavailable'
        priority: HIGH
        description: No successful enclosure API response was received within the configured interval. Check credentials, HTTPS service and management
          connectivity.
        dependencies:
        - name: 'HPE MSA: Device is unreachable by ICMP'
          expression: max(/HPE MSA API/icmpping[{$HPE.MSA.API.HOST}],3m)=0
        tags:
        - tag: component
          value: availability
        - tag: scope
          value: availability
    - uuid: c280a717aeda46e48d8bc4a0ff1f4270
      name: 'HPE MSA: ICMP ping'
      type: SIMPLE
      key: icmpping[{$HPE.MSA.API.HOST}]
      delay: 1m
      history: 7d
      trends: 365d
      description: Checks reachability of the MSA management address. Disable if ICMP is intentionally blocked.
      tags:
      - tag: component
        value: availability
      - tag: metric
        value: ping
      triggers:
      - uuid: d79fe46bd68048288d9ba64b5f85aa1c
        expression: max(/HPE MSA API/icmpping[{$HPE.MSA.API.HOST}],3m)=0
        name: 'HPE MSA: Device is unreachable by ICMP'
        priority: HIGH
        description: No ICMP replies were received for three minutes. This may indicate a device, power or network outage.
        tags:
        - tag: component
          value: availability
        - tag: scope
          value: availability
    - uuid: d4e612e4d5b449d8a6ae8680f3c2e53c
      name: 'HPE MSA: Get active alerts via API'
      type: SCRIPT
      key: hpe.msa.api.alerts
      delay: 5m
      history: 7d
      value_type: TEXT
      params: |-
        var params = JSON.parse(value);

        function fail(message) {
            throw 'HPE MSA Alerts API: ' + message;
        }

        function checkHttpStatus(request, operation) {
            var status = request.getStatus();
            if (status < 200 || status >= 300) {
                fail(operation + ' returned HTTP status ' + status);
            }
        }

        function extractXmlProperty(xml, propertyName) {
            var pattern = new RegExp(
                '<PROPERTY[^>]+name="' + propertyName + '"[^>]*>([^<]*)<\\/PROPERTY>'
            );
            var match = xml.match(pattern);
            if (match === null || match.length < 2) {
                fail('Property "' + propertyName + '" not found in login response.');
            }
            return match[1];
        }

        function decodeApiString(text) {
            return text
                .replace(/\\"/g, '"')
                .replace(/\\\\/g, '\\')
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '\r')
                .replace(/\\t/g, '\t');
        }

        function convertValue(name, rawValue) {
            var parsedValue = decodeApiString(rawValue);
            if (/-numeric$/.test(name) || name === 'id' || name === 'hit-count') {
                if (/^-?\d+$/.test(parsedValue)) {
                    return parseInt(parsedValue, 10);
                }
            }
            return parsedValue;
        }

        function parseApiObjects(apiResponse, constructorName) {
            var objects = [];
            var objectPattern = new RegExp(
                'new\\s+' + constructorName + '\\(\\[\\s*' +
                '((?:new\\s+APIProp\\(' +
                '\\{name:"(?:\\\\.|[^"])*",' +
                'value:"(?:\\\\.|[^"])*"\\}' +
                '\\),?\\s*)+)',
                'g'
            );
            var propertyPattern =
                /new\s+APIProp\(\{name:"((?:\\.|[^"])*)",value:"((?:\\.|[^"])*)"\}\)/g;
            var objectMatch;

            while ((objectMatch = objectPattern.exec(apiResponse)) !== null) {
                var object = {};
                var propertyMatch;
                propertyPattern.lastIndex = 0;
                while ((propertyMatch = propertyPattern.exec(objectMatch[1])) !== null) {
                    var propertyName = decodeApiString(propertyMatch[1]);
                    object[propertyName] = convertValue(propertyName, propertyMatch[2]);
                }
                if (object['durable-id']) {
                    objects.push(object);
                }
            }
            return objects;
        }

        function plainText(text) {
            if (!text) {
                return '';
            }
            return text
                .replace(/<br\s*\/?\s*>/gi, '\n')
                .replace(/&nbsp;/gi, ' ')
                .replace(/<[^>]+>/g, '')
                .replace(/\s+\n/g, '\n')
                .replace(/\n\s+/g, '\n')
                .trim();
        }

        if (!params.scheme || !params.host || !params.port) {
            fail('Scheme, host or port is missing.');
        }
        if (!params.username || !params.password) {
            fail('Username or password is missing.');
        }

        var baseUrl = params.scheme + '://' + params.host + ':' + params.port;
        var loginHash = sha256(params.username + '_' + params.password);
        var loginRequest = new HttpRequest();
        var loginResponse = loginRequest.get(baseUrl + '/api/login/' + loginHash);
        checkHttpStatus(loginRequest, 'Login');

        if (extractXmlProperty(loginResponse, 'response-type') !== 'Success') {
            fail('Login failed.');
        }
        var sessionKey = extractXmlProperty(loginResponse, 'response');

        var request = new HttpRequest();
        request.addHeader('sessionkey: ' + sessionKey);
        request.addHeader('datatype: wbi');
        request.addHeader(
            'Cookie: wbisessionkey=' + sessionKey + '; wbiusername=' + params.username
        );
        var response = request.get(baseUrl + '/api/show/alerts');
        checkHttpStatus(request, 'Get alerts');
        if (response.indexOf('Invalid sessionkey') !== -1) {
            fail('MSA rejected the generated session key.');
        }

        var alerts = parseApiObjects(response, 'APIAlerts');
        var active = [];
        var counts = { informational: 0, warning: 0, critical: 0 };
        var i;
        for (i = 0; i < alerts.length; i++) {
            if (alerts[i]['resolved-numeric'] === 0) {
                alerts[i].reason = plainText(alerts[i].reason);
                alerts[i]['recommended-action'] = plainText(alerts[i]['recommended-action']);
                active.push(alerts[i]);
                if (alerts[i]['severity-numeric'] === 3) {
                    counts.critical++;
                } else if (alerts[i]['severity-numeric'] === 1) {
                    counts.warning++;
                } else {
                    counts.informational++;
                }
            }
        }

        active.sort(function (a, b) {
            return (b['detected-time-numeric'] || 0) - (a['detected-time-numeric'] || 0);
        });

        var problems = active.filter(function (alert) {
            return alert['severity-numeric'] >= 1;
        });
        var newest = problems.length > 0 ? problems[0] : {};
        var summaryLines = [];
        var recommendationLines = [];
        for (i = 0; i < problems.length && i < 10; i++) {
            summaryLines.push(
                '[' + problems[i].severity + '] ' + problems[i].description +
                ': ' + problems[i].reason
            );
            if (problems[i]['recommended-action']) {
                recommendationLines.push(
                    problems[i].description + ': ' + problems[i]['recommended-action']
                );
            }
        }

        return JSON.stringify({
            summary: {
                active_total: active.length,
                active_informational: counts.informational,
                active_warning: counts.warning,
                active_critical: counts.critical,
                active_problem_total: counts.warning + counts.critical,
                problem_summary: summaryLines.join('\n'),
                recommendations: recommendationLines.join('\n'),
                newest_component: newest.component || '',
                newest_description: newest.description || '',
                newest_severity: newest.severity || '',
                newest_reason: newest.reason || '',
                newest_recommendation: newest['recommended-action'] || '',
                newest_detected_time: newest['detected-time'] || ''
            },
            active_alerts: active,
            active_problem_alerts: problems
        });
      timeout: 30s
      parameters:
      - name: host
        value: '{$HPE.MSA.API.HOST}'
      - name: password
        value: '{$HPE.MSA.API.PASSWORD}'
      - name: port
        value: '{$HPE.MSA.API.PORT}'
      - name: scheme
        value: '{$HPE.MSA.API.SCHEME}'
      - name: username
        value: '{$HPE.MSA.API.USER}'
      description: Retrieves MSA alerts, retains unresolved alerts and builds warning/critical summaries.
      tags:
      - tag: component
        value: alerts
      - tag: metric
        value: raw
      triggers:
      - uuid: fe9dc8d2b34d4856a403fb4d317888d5
        expression: nodata(/HPE MSA API/hpe.msa.api.alerts,{$HPE.MSA.ALERT.NODATA})=1
        name: 'HPE MSA: Alert API data is unavailable'
        priority: AVERAGE
