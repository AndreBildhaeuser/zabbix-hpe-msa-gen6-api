    description: |-
      Native health and availability monitoring for HPE MSA systems through the WBI API. No external scripts, agents or cron jobs are required. Includes hardware discovery, active alert aggregation and API availability checks. Tested on HPE MSA 1060 SAS with Zabbix 7.4.

      Version 1.0.0: production release with hardware discovery, active alert aggregation, availability checks, HDD/SSD-specific discovery and corrected controller memory units.
    discovery_rules:
    - uuid: 005358a130e74299a7d67922bccdbc30
      name: 'HPE MSA: Discover drives'
      type: DEPENDENT
      key: hpe.msa.drive.discovery
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      item_prototypes:
      - uuid: 84adf357633449acad698932d04b7cfb
        name: 'HPE MSA: Drive {#LOCATION}: Health'
        type: DEPENDENT
        key: hpe.msa.drive.health[{#DISKID}]
        history: 31d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.drives[?(@["durable-id"]=="{#DISKID}")]["health-numeric"].first()
        master_item:
          key: hpe.msa.api.disks.raw
        trends: 365d
        tags:
        - tag: component
          value: drive
        - tag: metric
          value: health
        - &id001
          tag: location
          value: '{#LOCATION}'
        - &id002
          tag: architecture
          value: '{#ARCHITECTURE}'
        - &id003
          tag: usage
          value: '{#USAGE}'
        trigger_prototypes:
        - uuid: 4923db297a3d47d097390f24d374d32e
          expression: last(/HPE MSA API/hpe.msa.drive.health[{#DISKID}])<>0
          name: 'HPE MSA: Drive {#LOCATION} health is not OK'
          priority: HIGH
          tags:
          - tag: component
            value: drive
          - tag: scope
            value: availability
