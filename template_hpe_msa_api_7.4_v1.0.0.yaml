    macros:
    - macro: '{$HPE.MSA.API.HOST}'
      description: MSA management hostname or IP address.
    - macro: '{$HPE.MSA.API.PASSWORD}'
      type: SECRET_TEXT
      description: MSA API password.
    - macro: '{$HPE.MSA.API.PORT}'
      value: '443'
    - macro: '{$HPE.MSA.API.SCHEME}'
      value: https
    - macro: '{$HPE.MSA.API.USER}'
      value: Administrator
    - macro: '{$HPE.MSA.DRIVE.TEMP.WARN}'
      value: '55'
      description: Drive temperature warning threshold in °C.
    - macro: '{$HPE.MSA.DRIVE.TEMP.CRIT}'
      value: '60'
      description: Drive temperature critical threshold in °C.
    - macro: '{$HPE.MSA.API.NODATA}'
      value: 10m
      description: Time without successful API data before an availability problem is raised.
    - macro: '{$HPE.MSA.ALERT.NODATA}'
      value: 15m
      description: Time without alert API data before an alert-endpoint problem is raised.
    tags:
    - tag: class
      value: storage
    - tag: target
      value: hpe_msa
    vendor:
      name: Community
      version: 1.0.0
    readme: |
      ## Overview

      Native Zabbix monitoring for HPE MSA storage systems using the management WBI API.

      Release: 1.0.0 (Zabbix 7.4).

      ### Required host macros

      - `{$HPE.MSA.API.HOST}` - MSA management hostname or IP
      - `{$HPE.MSA.API.USER}` - API/WebUI user
      - `{$HPE.MSA.API.PASSWORD}` - password, preferably Secret text

      Defaults: HTTPS, TCP 443, five-minute polling.

      ### Scope

      The template focuses on availability and health: drives, controllers, fans, PSUs, enclosures,
      host and management ports, expanders, active alerts and API reachability.

      ### Notes

      - The MSA returns `255` for SSD lifetime on HDDs. HDD and SSD-only metrics are discovered separately.
      - Informational unresolved alerts are collected but do not trigger a problem.
      - ICMP is checked against `{$HPE.MSA.API.HOST}`. Disable the ping item if ICMP is intentionally blocked.
